<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon Tab Browser -->
    <link rel="icon" type="image/png" href="/favicon_top.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon_top.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/favicon_top.png" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Sibundar Football Analytics | Analisis Sepak Bola Indonesia</title>

    <meta
      name="description"
      content="Sibundar Football Analytics adalah platform analisis sepak bola Indonesia yang menyajikan statistik pertandingan, analisis taktik, performa tim dan pemain, serta laporan pertandingan berbasis data."
    />

    <meta
      name="keywords"
      content="Sibundar, Sibundar Football Analytics, analisis sepak bola Indonesia, statistik sepak bola, statistik pertandingan, analisis taktik sepak bola, football analytics Indonesia, performa pemain, performa tim"
    />

    <meta
      name="author"
      content="Sibundar Football Analytics"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://sibundar.id/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Sibundar Football Analytics | Analisis Sepak Bola Indonesia"
    />

    <meta
      property="og:description"
      content="Statistik pertandingan, analisis taktik, performa tim dan pemain sepak bola Indonesia berbasis data."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://sibundar.id/"
    />

    <meta
      property="og:site_name"
      content="Sibundar Football Analytics"
    />

    <meta
      property="og:locale"
      content="id_ID"
    />

    <!-- Tetap menggunakan favicon.png -->
    <meta
      property="og:image"
      content="https://sibundar.id/favicon.png"
    />

    <meta
      property="og:image:alt"
      content="Sibundar Football Analytics"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Sibundar Football Analytics | Analisis Sepak Bola Indonesia"
    />

    <meta
      name="twitter:description"
      content="Statistik pertandingan, analisis taktik, performa tim dan pemain sepak bola Indonesia berbasis data."
    />

    <!-- Tetap menggunakan favicon.png -->
    <meta
      name="twitter:image"
      content="https://sibundar.id/favicon.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0B1220"
    />

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sibundar Football Analytics",
        "alternateName": [
          "Sibundar",
          "Sibundar.id"
        ],
        "url": "https://sibundar.id/"
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sibundar Football Analytics",
        "url": "https://sibundar.id/",
        "logo": "https://sibundar.id/favicon.png",
        "description": "Platform analisis sepak bola Indonesia berbasis data, statistik pertandingan, analisis taktik, performa tim dan pemain."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
